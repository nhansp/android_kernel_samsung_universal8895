%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/samsung,exynos8895-ion-legacy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos 8895 legacy ION allocator

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  /dev/ion with the legacy Android ION user ABI of the Samsung 4.4 kernel,
  for prebuilt Exynos userspace. Heap 0 (the page allocator) is implicit;
  every memory-region entry is one more heap, a reusable shared-dma-pool
  (CMA) region. The node has no iommus and is not dma-coherent: the driver
  uses it for CPU cache maintenance. Local binding of the greatlte port
  (spec L6A 4.3, 5.2.8), not for upstream.

properties:
  compatible:
    const: samsung,exynos8895-ion-legacy

  memory-region:
    minItems: 1
    maxItems: 15
    description: reusable shared-dma-pool regions, one per CMA heap

  memory-region-names:
    minItems: 1
    maxItems: 15
    description: heap names; the driver appends "_heap"

  samsung,ion-heap-ids:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 15
    items:
      minimum: 1
      maximum: 15
    description: legacy ION heap id of each memory-region entry (bit in heap_id_mask)

  samsung,ion-compat-ids:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 15
    description:
      per memory-region entry, the bit mask of Exynos contig ids (18..31) that
      select this heap through heap_id_mask 0x10; 0 for none

required:
  - compatible

dependencies:
  memory-region: [ memory-region-names, samsung,ion-heap-ids, samsung,ion-compat-ids ]

additionalProperties: false

examples:
  - |
    ion {
        compatible = "samsung,exynos8895-ion-legacy";
        memory-region = <&camera_mem>, <&crypto_rmem>, <&vstream_rmem>;
        memory-region-names = "camera", "crypto", "vstream";
        samsung,ion-heap-ids = <10 1 3>;
        samsung,ion-compat-ids = <0 0 0x82000000>;
    };
