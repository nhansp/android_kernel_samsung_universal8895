%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/samsung,s2mm005.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MM005 USB Type-C / Power Delivery port controller

maintainers:
  - nhansp <nhan.094.vn@gmail.com>

description:
  The S2MM005 runs USB Type-C and USB Power Delivery in its own firmware and
  reports the attach state, the data and power role and the PD messages over
  I2C. On the Samsung Galaxy Note 8 it works together with the MAX77865 MUIC,
  which switches the connector's D+/D- lines. The I2C controller node must
  provide a "hard_reset" pin state (SCL and SDA driven low) besides "default";
  it resets a controller that does not answer.

properties:
  compatible:
    const: samsung,s2mm005

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: interrupt line of the controller, falling edge

  orientation-gpios:
    maxItems: 1
    description:
      the plug orientation output of the controller (USB3.1_COM_SEL); high
      means the plug is reversed

  samsung,muic:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: the MAX77865 MUIC (maxim,max77865-muic) of the connector

  wakeup-source: true

  pinctrl-0: true

  pinctrl-names:
    const: default

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - samsung,muic
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@33 {
            compatible = "samsung,s2mm005";
            reg = <0x33>;
            interrupts-extended = <&gpa1 7 IRQ_TYPE_EDGE_FALLING>;
            orientation-gpios = <&gpi1 7 GPIO_ACTIVE_HIGH>;
            samsung,muic = <&max77865_muic>;
            wakeup-source;

            connector {
                compatible = "usb-c-connector";
                label = "USB-C";
                power-role = "dual";
                data-role = "dual";
                try-power-role = "sink";
                typec-power-opmode = "default";
            };
        };
    };
