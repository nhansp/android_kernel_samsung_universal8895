%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/samsung,exynos8895-mali.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm Mali-G71 GPU of the Samsung Exynos 8895 (vendor kbase driver)

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  Mali-G71 (tMIx) of the Exynos 8895, driven by Arm's vendor kbase r16p0
  driver that the stock userspace GLES blob requires. Not the Panfrost
  binding (arm,mali-bifrost.yaml): the interrupt names are the upper-case
  names of the stock device tree. Power through the pd_g3d power domain,
  the core clock through the ACPM DVFS G3D domain, no supply (the power
  management firmware owns the rail). The node is named mali@<reg>, not
  gpu@<reg>, as the stock device tree does (FDT:4636): the platform device
  directory the power HAL writes the DVFS locks in is
  /sys/devices/platform/13900000.mali. Local binding of the greatlte port
  (spec L6A_graphics.md 4.1), not for upstream.

properties:
  compatible:
    const: samsung,exynos8895-mali

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Job interrupt
      - description: MMU interrupt
      - description: GPU interrupt

  interrupt-names:
    items:
      - const: JOB
      - const: MMU
      - const: GPU

  clocks:
    maxItems: 1

  clock-names:
    const: clk_mali

  power-domains:
    maxItems: 1

  operating-points-v2: true

  "#cooling-cells":
    const: 2

  samsung,autosuspend-delay-ms:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: runtime-PM autosuspend delay of the GPU, in milliseconds
    default: 50

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains
  - operating-points-v2

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mali@13900000 {
        compatible = "samsung,exynos8895-mali";
        reg = <0x13900000 0x5000>;
        interrupts = <GIC_SPI 60 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 61 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 59 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "JOB", "MMU", "GPU";
        power-domains = <&pd_g3d>;
        clocks = <&acpm_ipc 4>;
        clock-names = "clk_mali";
        operating-points-v2 = <&gpu_opp_table>;
        #cooling-cells = <2>;
        samsung,autosuspend-delay-ms = <50>;
    };
