%YAML 1.2
---
$id: http://devicetree.org/schemas/media/samsung,exynos8895-jpeg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8895 SMFC JPEG codec

maintainers:
  - nhansp <nhan.094.vn@gmail.com>

description:
  Exynos 8895 SMFC (Still MFC) H/W JPEG codec, /dev/video12
  (spec L6B 4.8, 5.9). The IOMMU master of sysmmu_g2dd2; the MSCL
  scaler maps through it as its proxy.

properties:
  compatible:
    const: samsung,exynos8895-jpeg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: gate

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  dma-coherent: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - iommus

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos8895.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    smfc: jpeg@13b00000 {
        compatible = "samsung,exynos8895-jpeg";
        dma-coherent;
        reg = <0x13b00000 0x1000>;
        interrupts = <GIC_SPI 225 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cmu_g2d CLK_GOUT_G2D_JPEG_I_SMFC_CLK>;
        clock-names = "gate";
        iommus = <&sysmmu_g2dd2>;
        power-domains = <&pd_g2d>;
    };
