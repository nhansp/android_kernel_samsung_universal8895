%YAML 1.2
---
$id: http://devicetree.org/schemas/devfreq/samsung,exynos8895-bus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos8895 bus DVFS domain

maintainers:
  - nhansp <nhan.094.vn@gmail.com>

description: |
  One bus DVFS domain of the Samsung Exynos8895 SoC (MIF, INT, INTCAM, CAM or
  DISP), the stock devfreq_{mif,int,intcam,cam,disp} devices. The APM firmware
  sets the domain's frequency and voltage; the kernel requests a level through
  the domain's ACPM DVFS clock. The operating points are the ECT DVFS levels
  inside the ASV-enabled range. Every other per-domain constant is data of the
  compatible. Local binding of the greatlte port (spec L2b 4.4), not for
  upstream.

properties:
  compatible:
    enum:
      - samsung,exynos8895-bus-mif
      - samsung,exynos8895-bus-int
      - samsung,exynos8895-bus-intcam
      - samsung,exynos8895-bus-cam
      - samsung,exynos8895-bus-disp

  clocks:
    maxItems: 1
    description: the domain's ACPM DVFS clock

  operating-points-v2: true

  memory-region:
    maxItems: 1
    description:
      the ECT copy in DRAM; the driver checks its identity before it uses any
      table derived from the ECT

required:
  - compatible
  - clocks
  - operating-points-v2

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos8895-acpm.h>

    bus-int {
        compatible = "samsung,exynos8895-bus-int";
        clocks = <&acpm_ipc EXYNOS8895_CLK_ACPM_DVFS_INT>;
        operating-points-v2 = <&bus_int_opp_table>;
        memory-region = <&ect_mem>;
    };
