%YAML 1.2
---
$id: http://devicetree.org/schemas/power/pd-samsung.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC Power Domains

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |+
  Exynos processors include support for multiple power domains which are used
  to gate power to one or more peripherals on the processor.

allOf:
  - $ref: power-domain.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos8895-pd
    then:
      properties:
        reg:
          minItems: 1
          items:
            - description: CONFIGURATION, STATUS and OPTION registers of the
                domain in the PMU
            - description: register window of the block whose registers the
                domain's power sequence writes (the CMU_G3D PLL and mux words
                for the Exynos8895 G3D domain)
    else:
      properties:
        reg:
          maxItems: 1
        samsung,pmu-syscon: false
        samsung,sysreg: false

properties:
  compatible:
    oneOf:
      - enum:
          - samsung,exynos4210-pd
          - samsung,exynos5433-pd
      - items:
          - const: samsung,exynos8895-pd
          - const: samsung,exynos5433-pd

  reg:
    minItems: 1
    maxItems: 2

  clocks:
    deprecated: true
    maxItems: 1

  clock-names:
    deprecated: true
    maxItems: 1

  label:
    description:
      Human readable string with domain name. Will be visible in userspace
      to let user to distinguish between multiple domains in SoC.

  "#power-domain-cells":
    const: 0

  power-domains:
    maxItems: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      PMU system controller, for the PMU bits the domain's power-off sequence
      sets before the domain is switched off (Exynos8895 ABOX domain).

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      System register block of the domain. Its words that the domain loses
      when it is switched off are saved before power-off and restored after
      power-on.

required:
  - compatible
  - "#power-domain-cells"
  - reg

unevaluatedProperties: false

examples:
  - |
    lcd0_pd: power-domain@10023c80 {
        compatible = "samsung,exynos4210-pd";
        reg = <0x10023c80 0x20>;
        #power-domain-cells = <0>;
        label = "LCD0";
    };

    mfc_pd: power-domain@10044060 {
        compatible = "samsung,exynos4210-pd";
        reg = <0x10044060 0x20>;
        #power-domain-cells = <0>;
        label = "MFC";
    };

  - |
    pd_g3d: power-domain@164840e0 {
        compatible = "samsung,exynos8895-pd", "samsung,exynos5433-pd";
        reg = <0x164840e0 0x20>, <0x13800000 0x1000>;
        #power-domain-cells = <0>;
        label = "g3d";
    };
