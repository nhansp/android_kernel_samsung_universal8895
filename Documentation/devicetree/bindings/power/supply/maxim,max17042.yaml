%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max17042.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim 17042 fuel gauge series

maintainers:
  - Sebastian Reichel <sre@kernel.org>

allOf:
  - $ref: power-supply.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: maxim,max77865-battery
    then:
      required:
        - samsung,battery-ntc
        - samsung,capacity-max
        - samsung,capacity-max-margin
        - samsung,capacity-min
        - samsung,full-condition-microvolt
        - samsung,full-condition-percent
        - samsung,recharge-condition-microvolt
    else:
      properties:
        samsung,battery-ntc: false
        samsung,capacity-max: false
        samsung,capacity-max-margin: false
        samsung,capacity-min: false
        samsung,full-condition-microvolt: false
        samsung,full-condition-percent: false
        samsung,recharge-condition-microvolt: false
        maxim,ttf-cv-data: false

properties:
  compatible:
    enum:
      - maxim,max17042
      - maxim,max17047
      - maxim,max17050
      - maxim,max17055
      - maxim,max77705-battery
      - maxim,max77849-battery
      - maxim,max77865-battery

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: |
      The ALRT pin, an open-drain interrupt.

  maxim,rsns-microohm:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Resistance of rsns resistor in micro Ohms (datasheet-recommended value is 10000).
      Defining this property enables current-sense functionality.

  maxim,cold-temp:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Temperature threshold to report battery as cold (in tenths of degree Celsius).
      Default is not to report cold events.

  maxim,over-heat-temp:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Temperature threshold to report battery as over heated (in tenths of degree Celsius).
      Default is not to report over heating events.

  maxim,dead-volt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Voltage threshold to report battery as dead (in mV).
      Default is not to report dead battery events.

  maxim,over-volt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Voltage threshold to report battery as over voltage (in mV).
      Default is not to report over-voltage events.

  power-supplies: true
  monitored-battery: true

  samsung,battery-ntc:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      maxim,max77865-battery only. Type of the thermal zone (battery NTC) whose
      temperature the driver writes to the TEMP register; required for that
      compatible, whose temperature is host-written (CONFIG.TEX set).

  samsung,capacity-max:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 1000
    description:
      maxim,max77865-battery only. Gauge state of charge, in tenths of a
      percent, that is reported as 100 %. The driver lowers it at the end of a
      charge when the gauge stops short of 100 %; this is its upper bound.

  samsung,capacity-max-margin:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      maxim,max77865-battery only. How far below samsung,capacity-max the
      learned value may go, in tenths of a percent.

  samsung,capacity-min:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      maxim,max77865-battery only. Gauge state of charge, in tenths of a
      percent, that is reported as 0 %.

  samsung,full-condition-microvolt:
    description:
      maxim,max77865-battery only. Minimum cell voltage for the end of charge
      the charger signals to count as a full battery.

  samsung,full-condition-percent:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 100
    description:
      maxim,max77865-battery only. A full battery is reported as charging
      again once its capacity falls below this value and its cell voltage
      below samsung,recharge-condition-microvolt minus 50 mV.

  samsung,recharge-condition-microvolt:
    description:
      maxim,max77865-battery only. Cell voltage at which the charger restarts
      a full battery; see samsung,full-condition-percent.

  maxim,ttf-cv-data:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    items:
      items:
        - description: charge current in mA
        - description: state of charge in tenths of a percent
        - description: time to full in seconds
    description:
      maxim,max77865-battery only. The constant-voltage table of the
      time-to-full estimate, rows in falling charge current.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      battery@36 {
        compatible = "maxim,max17042";
        reg = <0x36>;
        maxim,rsns-microohm = <10000>;
        maxim,over-heat-temp = <600>;
        maxim,over-volt = <4300>;
      };
    };
