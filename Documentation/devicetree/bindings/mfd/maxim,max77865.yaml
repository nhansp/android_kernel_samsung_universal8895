%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/maxim,max77865.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77865 companion power management IC

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |
  The MAX77865 is the companion PMIC of Exynos 8895 phones (Samsung Galaxy
  Note 8). This node is its top-level page at I2C address 0x66: the register
  map and the interrupt source register (INTSRC), whose bits are exposed as a
  one-cell interrupt controller: 0 charger, 1 top-level (system), 2 fuel gauge.
  The charger (0x69) and the fuel gauge (0x36) are separate nodes on the same
  bus (maxim,max77865-charger, maxim,max77865-battery).

properties:
  compatible:
    const: maxim,max77865

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@66 {
            compatible = "maxim,max77865";
            reg = <0x66>;
            interrupt-parent = <&gpa1>;
            interrupts = <6 IRQ_TYPE_LEVEL_LOW>;
            interrupt-controller;
            #interrupt-cells = <1>;
            wakeup-source;
        };
    };
