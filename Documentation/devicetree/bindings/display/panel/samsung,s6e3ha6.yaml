%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e3ha6.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E3HA6 AMOLED DSI panel

description: |
  The S6E3HA6 is the display driver IC of the 1440x2960 AMOLED panel of the
  Samsung Galaxy Note 8 (greatlte). It runs in MIPI DSI command mode with
  four data lanes and VESA DSC (two slices of 720x40), and reports its
  tearing effect on a GPIO.

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,s6e3ha6

  reg:
    maxItems: 1

  reset-gpios: true

  te-gpios: true

  disp-det-gpios:
    maxItems: 1
    description:
      Panel detect / ESD line, high while the panel is connected and
      running.

  vddi3p0-supply:
    description: 3.0 V panel supply (VDD_DDI_3P0).

  vddi1p8-supply:
    description: 1.8 V I/O supply (VDD_DDI_1P8).

  vddi1p6-supply:
    description: 1.6 V core supply (VDD_DDI_1P6).

  width-mm: true
  height-mm: true

  dsu_en:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description:
      Dynamic Screen Scaling (DSU) support flag (1 = enabled, 0 = disabled).

  dsu_number:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 5
    description:
      Number of active DSU resolution modes exposed from the DSU mode arrays.

  dsu_width:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    description:
      Horizontal active resolution (in pixels) for each DSU mode entry.

  dsu_height:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    description:
      Vertical active resolution (in pixels) for each DSU mode entry.

  dsu_dsc_width:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    description:
      DSC slice width (in pixels) for each DSU mode entry.

  dsu_dsc_height:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    description:
      DSC slice height (in lines) for each DSU mode entry.

  dsu_dsc_en:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    description:
      DSC enable flag (1 = enabled, 0 = disabled) for each DSU mode entry.

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vddi3p0-supply
  - vddi1p8-supply
  - vddi1p6-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e3ha6";
            reg = <0>;
            reset-gpios = <&gpa0 5 GPIO_ACTIVE_LOW>;
            disp-det-gpios = <&gpi1 1 GPIO_ACTIVE_HIGH>;
            te-gpios = <&gpb0 1 GPIO_ACTIVE_HIGH>;
            vddi3p0-supply = <&s2dos03_ldo3>;
            vddi1p8-supply = <&s2dos03_ldo1>;
            vddi1p6-supply = <&s2dos03_buck1>;
            width-mm = <71>;
            height-mm = <145>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
