%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/samsung,brcm-wlan.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Broadcom WLAN platform glue

maintainers:
  - nhansp <nhan.094.vn@gmail.com>

description:
  Platform node for a Broadcom BCM4361 Wi-Fi module behind the Exynos PCIe
  host, driven by the bcmdhd4361 transplant glue (dhd_custom_exynos8895.c).

properties:
  compatible:
    const: samsung,brcm-wlan

  wlan-reg-on-gpios:
    maxItems: 1
    description: GPIO driving WLAN_REG_ON (active high).

  interrupts-extended:
    maxItems: 1
    description: WLAN_HOST_WAKE out-of-band IRQ from the module.

  samsung,pcie:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle of the PCIe RC this module hangs off.

  pinctrl-names:
    const: default

  pinctrl-0:
    description: Pin control for WLAN_REG_ON and WLAN_HOST_WAKE.

required:
  - compatible
  - wlan-reg-on-gpios
  - interrupts-extended
  - samsung,pcie

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wlan {
        compatible = "samsung,brcm-wlan";
        wlan-reg-on-gpios = <&gpj1 3 GPIO_ACTIVE_HIGH>;
        interrupts-extended = <&gpa0 7 IRQ_TYPE_EDGE_RISING>;
        samsung,pcie = <&pcie0>;
        pinctrl-names = "default";
        pinctrl-0 = <&cfg_wlanen &wlan_host_wake>;
        status = "okay";
    };
