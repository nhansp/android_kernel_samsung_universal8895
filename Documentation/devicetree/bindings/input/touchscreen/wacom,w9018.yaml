%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/wacom,w9018.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wacom W9018 digitizer

maintainers:
  - nhansp <nhan.094.vn@gmail.com>

description:
  I2C pen digitizer of the Samsung Galaxy Note 8 S Pen, with a pen detect
  (PDCT) line that reports whether the pen is in its slot.

properties:
  compatible:
    const: wacom,w9018

  reg:
    maxItems: 1

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: data
      - const: pdct

  pdct-gpios:
    maxItems: 1
    description: GPIO connected to pen detection (PDCT) pin

  fwe-gpios:
    maxItems: 1
    description: GPIO connected to flash write enable (FWE) pin

  vddo-supply:
    description: Power supply regulator for digitizer

  wacom,xy-switch:
    type: boolean
    description: Swap X and Y coordinates

  wacom,x-invert:
    type: boolean
    description: Invert X coordinate

  pinctrl-0: true
  pinctrl-names: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - pdct-gpios
  - fwe-gpios
  - vddo-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        digitizer@56 {
            compatible = "wacom,w9018";
            reg = <0x56>;
            interrupt-parent = <&gpa2>;
            interrupts = <2 IRQ_TYPE_LEVEL_LOW>,
                         <1 IRQ_TYPE_EDGE_BOTH>;
            interrupt-names = "data", "pdct";
            pdct-gpios = <&gpa2 1 GPIO_ACTIVE_HIGH>;
            fwe-gpios = <&gpe7 4 GPIO_ACTIVE_HIGH>;
            vddo-supply = <&wacom_3v3>;
            wacom,xy-switch;
            wacom,x-invert;
            pinctrl-names = "default";
            pinctrl-0 = <&epen_int_active>;
        };
    };
